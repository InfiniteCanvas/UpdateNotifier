services:
  api:
    image: update-notifier-api
    build:
      context: .
      dockerfile: UpdateNotifier/Dockerfile
    restart: unless-stopped
    environment:
      - DATABASE_PATH=/data/app.db
      - LOGS_FOLDER=/data/logs
      - SELF_HOSTED=${SELF_HOSTED:-false} # enables supporter features
      - RSS_UPDATE_INTERVAL=${RSS_UPDATE_INTERVAL:-5} # in minutes
      - RSS_FEED_URLS=${RSS_FEED_URLS:-}
      - XF_USER=${XF_USER}
      - XF_SESSION=${XF_SESSION}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:?set INTERNAL_API_KEY in .env (openssl rand -hex 32)}
      - INTERNAL_API_ALLOWED_CIDRS=${INTERNAL_API_ALLOWED_CIDRS:-}
    volumes:
      - ./data:/data
    networks:
      - default
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik}
      - traefik.http.routers.updatenotifier-api.rule=Host(`${DOMAIN:?set DOMAIN in .env}`) && (PathPrefix(`/api`) || PathPrefix(`/openapi`) || PathPrefix(`/scalar`)) && !PathPrefix(`/api/internal`)
      - traefik.http.routers.updatenotifier-api.priority=100
      - traefik.http.routers.updatenotifier-api.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.services.updatenotifier-api.loadbalancer.server.port=8080
      # enable if your entrypoint uses a cert resolver:
      # - traefik.http.routers.updatenotifier-api.tls.certresolver=${TRAEFIK_CERTRESOLVER}
    healthcheck:
      # no curl/wget in the runtime image — probe /health over bash's /dev/tcp
      test: ["CMD", "bash", "-c", 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf "GET /health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && grep -q " 200 " <&3']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  bot:
    image: update-notifier-bot
    build:
      context: .
      dockerfile: UpdateNotifier.Discord/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      - DISCORD_BOT_TOKEN=${TOKEN}
      - DISCORD_GUILD_ID=${GUILD_ID:?set GUILD_ID in .env}
      - PRIVILEGED_ROLE_IDS=${PRIVILEGED_ROLE_IDS:-}
      - ENVIRONMENT=production
      - SELF_HOSTED=${SELF_HOSTED:-false}
      - API_BASE_URL=http://api:8080
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:?set INTERNAL_API_KEY in .env (openssl rand -hex 32)}
    networks:
      - default

  web:
    image: update-notifier-web
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - default
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik}
      - traefik.http.routers.updatenotifier-web.rule=Host(`${DOMAIN:?set DOMAIN in .env}`)
      - traefik.http.routers.updatenotifier-web.priority=1
      - traefik.http.routers.updatenotifier-web.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.services.updatenotifier-web.loadbalancer.server.port=8080
      # - traefik.http.routers.updatenotifier-web.tls.certresolver=${TRAEFIK_CERTRESOLVER}

networks:
  traefik:
    external: true
